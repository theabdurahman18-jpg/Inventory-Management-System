<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | Inventory Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="app-wrapper">

        <!-- Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand-logo">
                    <div class="brand-icon"><i class="bi bi-box-seam-fill"></i></div>
                    <span>InventoryOS</span>
                </a>
            </div>

            <ul class="sidebar-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <i class="bi bi-grid-1x2-fill"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="products.html" class="nav-link">
                        <i class="bi bi-box-seam"></i>
                        <span>Products</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="categories.html" class="nav-link active">
                        <i class="bi bi-tags-fill"></i>
                        <span>Categories</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="reports.html" class="nav-link">
                        <i class="bi bi-bar-chart-line-fill"></i>
                        <span>Reports</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div class="avatar-circle user-display-avatar">A</div>
                    <div class="flex-grow-1 overflow-hidden">
                        <div class="fw-bold text-light text-truncate user-display-name">Admin User</div>
                        <small class="text-muted d-block text-truncate user-display-email">admin@inventory.com</small>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">

            <!-- Top Navigation Bar -->
            <header class="top-navbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggle-btn d-lg-none" id="sidebarToggle">
                        <i class="bi bi-list fs-5"></i>
                    </button>
                    <h4 class="page-title-heading">Category Management</h4>
                </div>

                <button class="btn btn-primary-glow" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                    <i class="bi bi-plus-circle-fill me-2"></i>Add Category
                </button>
            </header>

            <!-- Page Content Body -->
            <div class="content-body">

                <div class="row g-4" id="categoriesGrid">
                    <!-- Categories loaded dynamically by JS -->
                </div>

            </div>
        </main>
    </div>

    <!-- Add Category Modal -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-light"><i class="bi bi-tag-fill text-info me-2"></i>Add New Category</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addCategoryForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label text-muted">Category Name <span class="text-danger">*</span></label>
                            <input type="text" id="catNameInput" class="form-control" placeholder="e.g. Mobile Accessories" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Description</label>
                            <textarea id="catDescInput" class="form-control" rows="3" placeholder="Category purpose or hardware classification..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-glass" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-glow">Save Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="../js/firebase.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCategoriesGrid();
            document.getElementById('addCategoryForm')?.addEventListener('submit', handleAddCategorySubmit);
        });

        async function loadCategoriesGrid() {
            let categories = [];
            try {
                const res = await fetch(`${API_BASE_URL}/categories`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success) categories = data.categories;
                }
            } catch (e) {
                categories = StorageEngine.getCategories();
            }

            if (!categories || categories.length === 0) categories = StorageEngine.getCategories();

            const grid = document.getElementById('categoriesGrid');
            if (!grid) return;

            const products = StorageEngine.getProducts();

            grid.innerHTML = categories.map(cat => {
                const itemCount = products.filter(p => p.category.toLowerCase() === cat.name.toLowerCase()).length;
                return `
                    <div class="col-12 col-md-6 col-xl-4">
                        <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex align-items-center justify-content-between mb-3">
                                    <div class="stat-icon-wrapper stat-icon-blue">
                                        <i class="bi bi-tag-fill"></i>
                                    </div>
                                    <span class="badge bg-primary bg-opacity-25 text-info">${itemCount} Products</span>
                                </div>
                                <h4 class="fw-bold text-light mb-2">${cat.name}</h4>
                                <p class="text-muted fs-7">${cat.description || 'No description provided.'}</p>
                            </div>
                            <div class="pt-3 border-top border-secondary opacity-50 d-flex justify-content-between align-items-center mt-3">
                                <small class="text-dim">ID: ${cat.id}</small>
                                <button class="btn btn-sm btn-glass text-danger" onclick="deleteCategory('${cat.id}', '${cat.name}')">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function handleAddCategorySubmit(e) {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const name = document.getElementById('catNameInput').value.trim();
            const description = document.getElementById('catDescInput').value.trim();

            if (!name) return;

            setButtonLoading(submitBtn, true, 'Saving...');

            try {
                const res = await fetch(`${API_BASE_URL}/categories`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description })
                });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.error);

                showAlert(`Category '${name}' created!`, 'success');
            } catch (err) {
                let cats = StorageEngine.getCategories();
                if (cats.some(c => c.name.toLowerCase() === name.toLowerCase())) {
                    showAlert(`Category '${name}' already exists!`, 'danger');
                    setButtonLoading(submitBtn, false, 'Save Category');
                    return;
                }
                cats.push({ id: "cat_" + Date.now(), name, description });
                StorageEngine.saveCategories(cats);
                showAlert(`Category '${name}' created!`, 'success');
            } finally {
                setButtonLoading(submitBtn, false, 'Save Category');
                closeModal('addCategoryModal');
                e.target.reset();
                loadCategoriesGrid();
            }
        }

        async function deleteCategory(id, name) {
            if (!confirm(`Are you sure you want to delete category '${name}'?`)) return;
            try {
                await fetch(`${API_BASE_URL}/categories/${id}`, { method: 'DELETE' });
            } catch (e) {
                let cats = StorageEngine.getCategories();
                cats = cats.filter(c => c.id !== id);
                StorageEngine.saveCategories(cats);
            }
            showAlert(`Category '${name}' deleted.`, 'success');
            loadCategoriesGrid();
        }

        function closeModal(modalId) {
            const el = document.getElementById(modalId);
            if (el) {
                const modal = bootstrap.Modal.getInstance(el);
                if (modal) modal.hide();
            }
        }
    </script>
</body>
</html>
