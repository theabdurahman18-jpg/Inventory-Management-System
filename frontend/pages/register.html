<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Inventory Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page-wrapper">

    <div class="auth-bg-blob blob-1"></div>
    <div class="auth-bg-blob blob-2"></div>

    <div class="glass-card auth-card">
        <div class="auth-header">
            <div class="auth-logo-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="auth-title">Create Account</h3>
            <p class="auth-subtitle">Register to manage products & stock</p>
        </div>

        <form id="registerForm">
            <div class="auth-input-group">
                <i class="bi bi-person-fill"></i>
                <input type="text" id="regFullName" class="form-control" placeholder="Full Name" required>
            </div>

            <div class="auth-input-group">
                <i class="bi bi-envelope-fill"></i>
                <input type="email" id="regEmail" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="auth-input-group">
                <i class="bi bi-lock-fill"></i>
                <input type="password" id="regPassword" class="form-control" placeholder="Password (min 6 chars)" required>
            </div>

            <div class="auth-input-group">
                <i class="bi bi-shield-lock-fill"></i>
                <input type="password" id="regConfirmPassword" class="form-control" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn btn-primary-glow w-100 py-2 mt-2">
                <i class="bi bi-check-circle-fill me-2"></i>Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already registered? <a href="login.html">Sign In</a>
        </div>
    </div>

    <!-- Firebase & Auth Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="../js/firebase.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
