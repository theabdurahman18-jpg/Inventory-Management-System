<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Inventory Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page-wrapper">

    <div class="auth-bg-blob blob-1"></div>
    <div class="auth-bg-blob blob-2"></div>

    <div class="glass-card auth-card">
        <div class="auth-header">
            <div class="auth-logo-icon">
                <i class="bi bi-box-seam-fill"></i>
            </div>
            <h3 class="auth-title">Welcome Back</h3>
            <p class="auth-subtitle">Sign in to your Inventory Portal</p>
        </div>

        <form id="loginForm">
            <div class="auth-input-group">
                <i class="bi bi-envelope-fill"></i>
                <input type="email" id="loginEmail" class="form-control" placeholder="Email Address" required value="admin@inventory.com">
            </div>

            <div class="auth-input-group">
                <i class="bi bi-lock-fill"></i>
                <input type="password" id="loginPassword" class="form-control" placeholder="Password" required value="admin123">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 fs-7">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="text-info text-decoration-none" onclick="alert('Demo Mode: Use any valid email & password to test sign in.')">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary-glow w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register Account</a>
        </div>
    </div>

    <!-- Firebase & Auth Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="../js/firebase.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
