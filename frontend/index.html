<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System | Cloud Web Application</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page-wrapper">

    <div class="auth-bg-blob blob-1"></div>
    <div class="auth-bg-blob blob-2"></div>

    <div class="glass-card auth-card text-center py-5 px-4">
        <div class="auth-logo-icon mx-auto mb-3">
            <i class="bi bi-box-seam-fill"></i>
        </div>
        <h2 class="fw-bold text-light mb-2">Inventory Management</h2>
        <p class="text-muted mb-4 fs-6">Enterprise Cloud Stock Monitoring & Analytics</p>

        <div class="spinner-border text-info mb-3" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-dim fs-7">Checking authentication session...</p>

        <div class="mt-4 pt-3 border-top border-secondary opacity-50 d-flex justify-content-center gap-3">
            <a href="pages/login.html" class="btn btn-primary-glow btn-sm w-50">Login</a>
            <a href="pages/register.html" class="btn btn-glass btn-sm w-50">Register</a>
        </div>
    </div>

    <script src="js/firebase.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const user = StorageEngine.getUser();
                if (user) {
                    window.location.href = 'pages/dashboard.html';
                } else {
                    window.location.href = 'pages/login.html';
                }
            }, 800);
        });
    </script>
</body>
</html>
